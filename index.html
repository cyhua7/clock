<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間顯示器</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: orbFloat 15s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #00ffff, transparent);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #ff00ff, transparent);
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #00ff88, transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -40px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.9); }
            75% { transform: translate(40px, 30px) scale(1.05); }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 3rem;
        }

        .date-display {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.3em;
            margin-bottom: 1.5rem;
            font-weight: 300;
            text-transform: uppercase;
        }

        .time-display {
            font-family: 'Orbitron', monospace;
            font-size: clamp(4rem, 12vw, 10rem);
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff, #00ff88, #00ffff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease-in-out infinite;
            text-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .seconds-display {
            font-family: 'Orbitron', monospace;
            font-size: clamp(2rem, 5vw, 4rem);
            color: rgba(0, 255, 255, 0.4);
            font-weight: 400;
            margin-bottom: 2rem;
        }

        .divider {
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            margin: 0 auto 2rem;
            position: relative;
        }

        .divider::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            filter: blur(8px);
        }

        .week-display {
            font-size: 1.2rem;
            color: rgba(0, 255, 136, 0.7);
            letter-spacing: 0.5em;
            font-weight: 400;
        }

        .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00ffff;
            border-radius: 50%;
            margin: 0 0.5rem;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .corner-decoration {
            position: fixed;
            width: 60px;
            height: 60px;
            border: 2px solid rgba(0, 255, 255, 0.2);
        }

        .corner-tl { top: 30px; left: 30px; border-right: none; border-bottom: none; }
        .corner-tr { top: 30px; right: 30px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 30px; left: 30px; border-right: none; border-top: none; }
        .corner-br { bottom: 30px; right: 30px; border-left: none; border-top: none; }

        .scanline {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.05) 2px,
                rgba(0, 0, 0, 0.05) 4px
            );
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="scanline"></div>
    
    <div class="corner-decoration corner-tl"></div>
    <div class="corner-decoration corner-tr"></div>
    <div class="corner-decoration corner-bl"></div>
    <div class="corner-decoration corner-br"></div>

    <div class="container">
        <div class="date-display" id="date"></div>
        <div class="time-display" id="time"></div>
        <div class="seconds-display" id="seconds"></div>
        <div class="divider"></div>
        <div class="week-display">
            <span class="pulse-dot"></span>
            <span id="week"></span>
            <span class="pulse-dot"></span>
        </div>
    </div>

    <script>
        const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        
        function padZero(num) {
            return num.toString().padStart(2, '0');
        }

        function updateDateTime() {
            const now = new Date();
            
            const year = now.getFullYear();
            const month = padZero(now.getMonth() + 1);
            const day = padZero(now.getDate());
            const hours = padZero(now.getHours());
            const minutes = padZero(now.getMinutes());
            const seconds = padZero(now.getSeconds());
            const weekDay = weekDays[now.getDay()];

            document.getElementById('date').textContent = `${year} / ${month} / ${day}`;
            document.getElementById('time').textContent = `${hours}:${minutes}`;
            document.getElementById('seconds').textContent = `:${seconds}`;
            document.getElementById('week').textContent = weekDay;
        }

        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>
</body>
</html>
